version: 2
updates:
  # Terraform provider version updates, one entry per environment
  - package-ecosystem: "terraform"
    directory: "/envs/dev"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "terraform", "dev"]

  - package-ecosystem: "terraform"
    directory: "/envs/qa"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "terraform", "qa"]

  - package-ecosystem: "terraform"
    directory: "/envs/prod"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "terraform", "prod"]

  # Pinned GitHub Actions versions — a stale actions/checkout is a real
  # supply-chain surface, not just a lint warning.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "github-actions"]