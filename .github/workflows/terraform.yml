name: Terraform Infrastructure

# Push/PR to main touching envs/dev/** or modules/** -> plan (+apply on merge)
# Manual dispatch -> choose environment (dev/qa/prod) and action
#
# AUTH: GitHub OIDC. No static AWS keys in this repo. The role ARN lives in the
# repo variable AWS_TF_ROLE_ARN, created by scripts/00-bootstrap-github-oidc.sh

on:
  push:
    branches: [main]
    paths:
      - 'envs/dev/**'
      - 'modules/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'envs/dev/**'
      - 'modules/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, qa, prod]
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply, destroy]
      confirm_destroy:
        description: 'Type "destroy" to confirm (required when action=destroy)'
        required: false
        default: ''

# id-token: write is what lets the runner request a GitHub OIDC token.
# Without it, configure-aws-credentials fails with "Credentials could not be loaded".
permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: '1.10.0'
  AWS_REGION: eu-central-1
  TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}

# Serialise runs per branch+env. Two concurrent applies against one state file
# is the fastest way to corrupt it.
concurrency:
  group: terraform-${{ github.ref }}-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  # ══ Plan ══════════════════════════════════════════════════════════════════
  plan:
    name: Terraform Plan (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    if: github.event.inputs.action != 'destroy'
    defaults:
      run:
        working-directory: envs/${{ github.event.inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # OIDC: GitHub mints a short-lived JWT, AWS validates it against the
      # provider and the sub-claim condition, and returns 1-hour STS creds.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TF_ROLE_ARN }}
          role-session-name: gha-terraform-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify assumed identity
        run: aws sts get-caller-identity

      # Secrets are exported as TF_VAR_* rather than passed with -var, so they
      # never appear in a command line. Terraform picks them up automatically.
      - name: Resolve environment secrets
        env:
          DEV_MLFLOW_DB_PASSWORD:      ${{ secrets.DEV_MLFLOW_DB_PASSWORD }}
          DEV_KAFKA_PASSWORD:          ${{ secrets.DEV_KAFKA_PASSWORD }}
          DEV_GRAFANA_ADMIN_PASSWORD:  ${{ secrets.DEV_GRAFANA_ADMIN_PASSWORD }}
          DEV_GITOPS_PAT:              ${{ secrets.DEV_GITOPS_PAT }}
          QA_MLFLOW_DB_PASSWORD:       ${{ secrets.QA_MLFLOW_DB_PASSWORD }}
          QA_KAFKA_PASSWORD:           ${{ secrets.QA_KAFKA_PASSWORD }}
          QA_GRAFANA_ADMIN_PASSWORD:   ${{ secrets.QA_GRAFANA_ADMIN_PASSWORD }}
          QA_GITOPS_PAT:               ${{ secrets.QA_GITOPS_PAT }}
          PROD_MLFLOW_DB_PASSWORD:     ${{ secrets.PROD_MLFLOW_DB_PASSWORD }}
          PROD_KAFKA_PASSWORD:         ${{ secrets.PROD_KAFKA_PASSWORD }}
          PROD_GRAFANA_ADMIN_PASSWORD: ${{ secrets.PROD_GRAFANA_ADMIN_PASSWORD }}
          PROD_GITOPS_PAT:             ${{ secrets.PROD_GITOPS_PAT }}
        run: |
          case "${{ env.TARGET_ENV }}" in
            dev)
              echo "TF_VAR_mlflow_db_password=${DEV_MLFLOW_DB_PASSWORD}"         >> $GITHUB_ENV
              echo "TF_VAR_kafka_password=${DEV_KAFKA_PASSWORD}"                 >> $GITHUB_ENV
              echo "TF_VAR_grafana_admin_password=${DEV_GRAFANA_ADMIN_PASSWORD}" >> $GITHUB_ENV
              echo "TF_VAR_gitops_pat=${DEV_GITOPS_PAT}"                         >> $GITHUB_ENV
              ;;
            qa)
              echo "TF_VAR_mlflow_db_password=${QA_MLFLOW_DB_PASSWORD}"          >> $GITHUB_ENV
              echo "TF_VAR_kafka_password=${QA_KAFKA_PASSWORD}"                  >> $GITHUB_ENV
              echo "TF_VAR_grafana_admin_password=${QA_GRAFANA_ADMIN_PASSWORD}"  >> $GITHUB_ENV
              echo "TF_VAR_gitops_pat=${QA_GITOPS_PAT}"                          >> $GITHUB_ENV
              ;;
            prod)
              echo "TF_VAR_mlflow_db_password=${PROD_MLFLOW_DB_PASSWORD}"         >> $GITHUB_ENV
              echo "TF_VAR_kafka_password=${PROD_KAFKA_PASSWORD}"                 >> $GITHUB_ENV
              echo "TF_VAR_grafana_admin_password=${PROD_GRAFANA_ADMIN_PASSWORD}" >> $GITHUB_ENV
              echo "TF_VAR_gitops_pat=${PROD_GITOPS_PAT}"                         >> $GITHUB_ENV
              ;;
          esac
          echo "TF_VAR_aws_region=${{ env.AWS_REGION }}" >> $GITHUB_ENV
          echo "TF_VAR_github_org=${{ vars.GH_ORG }}"    >> $GITHUB_ENV

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend-config=backend.tfvars

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan -no-color
        continue-on-error: true

      - name: Comment plan summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          FMT: ${{ steps.fmt.outcome }}
          INIT: ${{ steps.init.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          PLAN: ${{ steps.plan.outcome }}
        with:
          script: |
            const body = `### Terraform Plan — \`${{ env.TARGET_ENV }}\`
            | Step | Result |
            |---|---|
            | Format   | \`${process.env.FMT}\` |
            | Init     | \`${process.env.INIT}\` |
            | Validate | \`${process.env.VALIDATE}\` |
            | Plan     | \`${process.env.PLAN}\` |

            Full output: [Actions log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Check plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # S3-native locking leaves a .tflock object behind if the job dies mid-run.
      # Clearing it on failure saves a manual force-unlock next time.
      - name: Release state lock on failure
        if: failure() || cancelled()
        run: |
          aws s3 rm "s3://${{ vars.TF_STATE_BUCKET }}/envs/${{ env.TARGET_ENV }}/terraform.tfstate.tflock" || true

      - name: Upload plan file
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.TARGET_ENV }}
          path: envs/${{ env.TARGET_ENV }}/tfplan
          retention-days: 1

  # ══ Apply ═════════════════════════════════════════════════════════════════
  apply:
    name: Terraform Apply (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    needs: plan
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    # The GitHub Environment is the manual approval gate. Configure required
    # reviewers on it in repo settings — that is what makes apply deliberate.
    environment: ${{ github.event.inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: envs/${{ github.event.inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TF_ROLE_ARN }}
          role-session-name: gha-terraform-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend-config=backend.tfvars

      - name: Download plan file
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.TARGET_ENV }}
          path: envs/${{ env.TARGET_ENV }}

      # Applying the SAVED plan, not re-planning. This guarantees what was
      # reviewed is exactly what gets applied. It is also why no TF_VAR_* are
      # needed here — they are already baked into the plan file.
      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color tfplan

      - name: Show outputs
        run: terraform output -no-color

      - name: Release state lock on failure
        if: failure() || cancelled()
        run: |
          aws s3 rm "s3://${{ vars.TF_STATE_BUCKET }}/envs/${{ env.TARGET_ENV }}/terraform.tfstate.tflock" || true

  # ══ Destroy ═══════════════════════════════════════════════════════════════
  # Requires BOTH action=destroy AND the literal word "destroy" typed in.
  # Two independent confirmations, because this is the irreversible one.
  destroy:
    name: Terraform Destroy (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy' &&
      github.event.inputs.confirm_destroy == 'destroy'
    environment: ${{ github.event.inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: envs/${{ github.event.inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TF_ROLE_ARN }}
          role-session-name: gha-terraform-destroy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve environment secrets
        env:
          DEV_MLFLOW_DB_PASSWORD:      ${{ secrets.DEV_MLFLOW_DB_PASSWORD }}
          DEV_KAFKA_PASSWORD:          ${{ secrets.DEV_KAFKA_PASSWORD }}
          DEV_GRAFANA_ADMIN_PASSWORD:  ${{ secrets.DEV_GRAFANA_ADMIN_PASSWORD }}
          DEV_GITOPS_PAT:              ${{ secrets.DEV_GITOPS_PAT }}
          QA_MLFLOW_DB_PASSWORD:       ${{ secrets.QA_MLFLOW_DB_PASSWORD }}
          QA_KAFKA_PASSWORD:           ${{ secrets.QA_KAFKA_PASSWORD }}
          QA_GRAFANA_ADMIN_PASSWORD:   ${{ secrets.QA_GRAFANA_ADMIN_PASSWORD }}
          QA_GITOPS_PAT:               ${{ secrets.QA_GITOPS_PAT }}
          PROD_MLFLOW_DB_PASSWORD:     ${{ secrets.PROD_MLFLOW_DB_PASSWORD }}
          PROD_KAFKA_PASSWORD:         ${{ secrets.PROD_KAFKA_PASSWORD }}
          PROD_GRAFANA_ADMIN_PASSWORD: ${{ secrets.PROD_GRAFANA_ADMIN_PASSWORD }}
          PROD_GITOPS_PAT:             ${{ secrets.PROD_GITOPS_PAT }}
        run: |
          case "${{ env.TARGET_ENV }}" in
            dev)
              echo "TF_VAR_mlflow_db_password=${DEV_MLFLOW_DB_PASSWORD}"         >> $GITHUB_ENV
              echo "TF_VAR_kafka_password=${DEV_KAFKA_PASSWORD}"                 >> $GITHUB_ENV
              echo "TF_VAR_grafana_admin_password=${DEV_GRAFANA_ADMIN_PASSWORD}" >> $GITHUB_ENV
              echo "TF_VAR_gitops_pat=${DEV_GITOPS_PAT}"                         >> $GITHUB_ENV
              ;;
            qa)
              echo "TF_VAR_mlflow_db_password=${QA_MLFLOW_DB_PASSWORD}"          >> $GITHUB_ENV
              echo "TF_VAR_kafka_password=${QA_KAFKA_PASSWORD}"                  >> $GITHUB_ENV
              echo "TF_VAR_grafana_admin_password=${QA_GRAFANA_ADMIN_PASSWORD}"  >> $GITHUB_ENV
              echo "TF_VAR_gitops_pat=${QA_GITOPS_PAT}"                          >> $GITHUB_ENV
              ;;
            prod)
              echo "TF_VAR_mlflow_db_password=${PROD_MLFLOW_DB_PASSWORD}"         >> $GITHUB_ENV
              echo "TF_VAR_kafka_password=${PROD_KAFKA_PASSWORD}"                 >> $GITHUB_ENV
              echo "TF_VAR_grafana_admin_password=${PROD_GRAFANA_ADMIN_PASSWORD}" >> $GITHUB_ENV
              echo "TF_VAR_gitops_pat=${PROD_GITOPS_PAT}"                         >> $GITHUB_ENV
              ;;
          esac
          echo "TF_VAR_aws_region=${{ env.AWS_REGION }}" >> $GITHUB_ENV
          echo "TF_VAR_github_org=${{ vars.GH_ORG }}"    >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init -backend-config=backend.tfvars

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -no-color

      - name: Release state lock on failure
        if: failure() || cancelled()
        run: |
          aws s3 rm "s3://${{ vars.TF_STATE_BUCKET }}/envs/${{ env.TARGET_ENV }}/terraform.tfstate.tflock" || true